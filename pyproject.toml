[project]
name = "pusht"
version = "0.1.0"
description = "Research harness for flow matching action-chunk policies on Push-T, managed with Hydra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gym-pusht>=0.1.6",
    "hydra-core>=1.3.7,<1.4",
    "pymunk<7",
    "setuptools>=80.9.0",
    "torch>=2.9.1,<2.10",
    "wandb==0.23.1",
    "zarr>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14.10",
]
# The documentation (docs/): uv run --only-group docs sphinx-build -W -b html docs docs/_build/html. Torch, the
# simulator and W&B are mocked there, so the group carries only what the modules import for real.
docs = [
    "furo>=2024.8.6",
    "hydra-core>=1.3.7,<1.4",
    "myst-parser>=4.0",
    "numpy>=2.0",
    "sphinx>=8.1",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["cuda: needs a CUDA device"]

[tool.ruff.lint]
# dict(...) keyword calls read like the keyword arguments they are passed as.
extend-ignore = ["C408"]
