# The training objective (flow.FlowMatching). Noise at t = 0, data at t = 1: x_t = alpha(t) z + beta(t) eps.
defaults:
  - path: linear
  - time: uniform
  - _self_

_target_: flow.FlowMatching
recipe: scaled_score_mse # scaled_score_mse (sampled from t = 0.05) | velocity_mse | data_output_velocity_loss
                         # (needs flow/time=uniform with a support that excludes t = 1) | data_mse
reduction: sum           # sum: squared error summed over a chunk's valid steps, averaged over chunks
                         # | example_mean: averaged over each chunk's valid coordinates first
